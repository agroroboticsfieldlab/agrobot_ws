# Logitech F710 in XInput mode (switch on the back set to X).
# Hold LB to drive, hold LB + RB for turbo. Left stick up/down = forward/backward, right stick left/right = turn.
#
# Axes:    0 left stick L/R, 1 left stick U/D, 2 LT, 3 right stick L/R, 4 right stick U/D, 5 RT, 6 D-pad L/R, 7 D-pad U/D
# Buttons: 0 A, 1 B, 2 X, 3 Y, 4 LB, 5 RB, 6 Back, 7 Start, 8 Logitech, 9 left stick, 10 right stick

joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.1
    autorepeat_rate: 20.0

teleop_twist_joy_node:
  ros__parameters:
    publish_stamped_twist: true
    frame: base_footprint

    require_enable_button: true
    enable_button: 4         # LB
    enable_turbo_button: 5   # RB

    axis_linear:
      x: 1
    scale_linear:
      x: 0.5                 # m/s
    scale_linear_turbo:
      x: 1.0                 # m/s, matches curio linear.x.max_velocity (atd allows 1.2)

    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 0.6               # rad/s
    scale_angular_turbo:
      yaw: 1.0               # rad/s, matches angular.z.max_velocity
