controller_manager:
  ros__parameters:
    update_rate: 10  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    agrobot:
      type: diff_drive_controller/DiffDriveController

agrobot:
  ros__parameters:
    # Skid steering: diff_drive_controller drives both wheels of a side with the same speed
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    wheel_separation: 1.552  # 2 x 0.776, distance between left and right wheel centers (URDF)
    wheel_radius: 0.2032

    # Skid steering slips in turns: the effective track is wider than the real one.
    # Tune on the ground: turn 360 deg in place and scale until odom matches.
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    #publish_limited_velocity: true
    #velocity_rolling_window_size: 10

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 1.2  # 5.9 rad/s at the wheel, 47 ODrive turns/s (max approx. 84)
    linear.x.min_velocity: -1.2
    linear.x.max_acceleration: 1.0
    linear.x.max_jerk: .nan
    linear.x.min_jerk: .nan

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 1.0
    angular.z.min_acceleration: -1.0
    angular.z.max_jerk: .nan
    angular.z.min_jerk: .nan
